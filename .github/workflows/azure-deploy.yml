name: Deploy RouteWise to Azure

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci
          node -e "require('./server'); console.log('Backend syntax validated'); process.exit(0);"

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-azure-swa:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && false # Set to true when Azure deployment tokens are added to GitHub Secrets
    steps:
      - uses: actions/checkout@v4
      - name: Build And Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist"
